<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3290"/></marker>
  </defs>
  <rect width="720" height="440" fill="#ffffff"/>

  <!-- browser -->
  <rect x="14" y="150" width="140" height="120" rx="16" fill="#ddf5ee" stroke="#1f7a5f" stroke-width="2"/>
  <rect x="26" y="164" width="116" height="16" rx="8" fill="#ffffff"/>
  <text x="84" y="176" font-size="10" text-anchor="middle" fill="#4b4763">localhost:3000/login</text>
  <text x="84" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1b2e">The browser</text>
  <text x="84" y="230" font-size="11.5" text-anchor="middle" fill="#4b4763">on a phone or</text>
  <text x="84" y="245" font-size="11.5" text-anchor="middle" fill="#4b4763">computer</text>

  <!-- request / response arrows -->
  <line x1="156" y1="185" x2="218" y2="185" stroke="#3b3290" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="187" y="176" font-size="10.5" text-anchor="middle" fill="#3b3290" font-weight="700">request</text>
  <line x1="218" y1="240" x2="156" y2="240" stroke="#c42a85" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="187" y="258" font-size="10.5" text-anchor="middle" fill="#c42a85" font-weight="700">HTML page</text>

  <!-- server -->
  <rect x="220" y="14" width="300" height="412" rx="18" fill="#f4f2fc" stroke="#4a3fb0" stroke-width="2"/>
  <text x="370" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#231d5c">The server: Node.js running src/server.js</text>
  <text x="370" y="56" font-size="11.5" text-anchor="middle" fill="#4b4763">Express app built in src/app.js, in this order:</text>

  <g font-size="12.5">
    <rect x="238" y="68" width="264" height="44" rx="10" fill="#ffffff" stroke="#c9c4ef"/>
    <text x="252" y="88" font-weight="700" fill="#1f1b2e">1. Static files</text><text x="252" y="104" font-size="11" fill="#4b4763">public/ : CSS, fonts, pictures, small scripts</text>
    <rect x="238" y="120" width="264" height="44" rx="10" fill="#ffffff" stroke="#c9c4ef"/>
    <text x="252" y="140" font-weight="700" fill="#1f1b2e">2. Middleware</text><text x="252" y="156" font-size="11" fill="#4b4763">src/middleware/ : session, user, language, CSRF</text>
    <rect x="238" y="172" width="264" height="44" rx="10" fill="#ffffff" stroke="#4a3fb0" stroke-width="1.6"/>
    <text x="252" y="192" font-weight="700" fill="#1f1b2e">3. Routes</text><text x="252" y="208" font-size="11" fill="#4b4763">src/routes/ : "which page or form is this?"</text>
    <rect x="238" y="224" width="264" height="44" rx="10" fill="#ffffff" stroke="#c9c4ef"/>
    <text x="252" y="244" font-weight="700" fill="#1f1b2e">4. Services</text><text x="252" y="260" font-size="11" fill="#4b4763">src/services/ : the rules (seats, SMS, dates)</text>
    <rect x="238" y="276" width="264" height="44" rx="10" fill="#ffffff" stroke="#c9c4ef"/>
    <text x="252" y="296" font-weight="700" fill="#1f1b2e">5. Models</text><text x="252" y="312" font-size="11" fill="#4b4763">src/models/ : tables, through Sequelize</text>
    <rect x="238" y="328" width="264" height="44" rx="10" fill="#fef3d6" stroke="#e5a417"/>
    <text x="252" y="348" font-weight="700" fill="#1f1b2e">6. Views</text><text x="252" y="364" font-size="11" fill="#4b4763">views/*.ejs : templates filled in with data</text>
  </g>
  <text x="370" y="398" font-size="11" text-anchor="middle" fill="#4b4763">Socket.IO (src/sockets/) shares the same server</text>
  <text x="370" y="413" font-size="11" text-anchor="middle" fill="#4b4763">for live chat; cron jobs (src/services/cron.js) run on a timer.</text>

  <!-- database -->
  <path d="M572 262 a62 14 0 0 0 124 0 v86 a62 14 0 0 1 -124 0z" fill="#e0dcf7" stroke="#4a3fb0" stroke-width="2"/>
  <ellipse cx="634" cy="262" rx="62" ry="14" fill="#efedfb" stroke="#4a3fb0" stroke-width="2"/>
  <text x="634" y="302" font-size="14" font-weight="700" text-anchor="middle" fill="#1f1b2e">PostgreSQL</text>
  <text x="634" y="320" font-size="11" text-anchor="middle" fill="#4b4763">the database: users,</text>
  <text x="634" y="335" font-size="11" text-anchor="middle" fill="#4b4763">events, registrations</text>
  <line x1="504" y1="298" x2="568" y2="298" stroke="#3b3290" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- outside services -->
  <rect x="560" y="60" width="148" height="140" rx="14" fill="#fde9dc" stroke="#a8380a" stroke-width="1.6"/>
  <text x="634" y="84" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f1b2e">Outside services</text>
  <text x="574" y="108" font-size="11.5" fill="#1f1b2e">• Brevo: SMS + email</text>
  <text x="574" y="128" font-size="11.5" fill="#1f1b2e">• Cloudinary: uploads</text>
  <text x="574" y="148" font-size="11.5" fill="#1f1b2e">• Google Translate</text>
  <text x="574" y="174" font-size="10.5" fill="#4b4763">all optional: the site</text>
  <text x="574" y="188" font-size="10.5" fill="#4b4763">still runs without them</text>
  <line x1="504" y1="246" x2="572" y2="190" stroke="#a8380a" stroke-width="2" marker-end="url(#a)"/>
</svg>
