<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>
  <!-- root -->
  <rect x="250" y="10" width="220" height="40" rx="12" fill="#231d5c"/>
  <text x="360" y="35" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">seniorpaddi-frontend/</text>
  <g stroke="#b9b4cf" stroke-width="2" fill="none">
    <path d="M360 50 V64 H94 V78"/><path d="M360 64 H272 V78"/><path d="M360 64 H450 V78"/><path d="M360 64 H628 V78"/>
  </g>

  <!-- src -->
  <rect x="14" y="78" width="160" height="300" rx="14" fill="#f4f2fc" stroke="#4a3fb0" stroke-width="1.6"/>
  <text x="28" y="102" font-size="14" font-weight="700" fill="#3b3290">src/</text>
  <text x="28" y="118" font-size="10.5" fill="#4b4763">the server's code</text>
  <g font-size="11.5" fill="#1f1b2e">
    <text x="28" y="142">server.js <tspan fill="#4b4763" font-size="10">start here</tspan></text>
    <text x="28" y="162">app.js <tspan fill="#4b4763" font-size="10">builds Express</tspan></text>
    <text x="28" y="182">config/</text>
    <text x="28" y="202">middleware/</text>
    <text x="28" y="222" font-weight="700">routes/ <tspan fill="#4b4763" font-size="10" font-weight="400">pages, forms</tspan></text>
    <text x="28" y="242">services/ <tspan fill="#4b4763" font-size="10">the rules</tspan></text>
    <text x="28" y="262">models/ <tspan fill="#4b4763" font-size="10">tables</tspan></text>
    <text x="28" y="282">migrations/</text>
    <text x="28" y="302">sockets/ <tspan fill="#4b4763" font-size="10">live chat</tspan></text>
    <text x="28" y="322">scripts/ <tspan fill="#4b4763" font-size="10">npm run ...</tspan></text>
    <text x="28" y="342" font-weight="700">styles/input.css</text>
    <text x="28" y="360" fill="#4b4763" font-size="10">← edit the design here</text>
  </g>

  <!-- views -->
  <rect x="192" y="78" width="160" height="300" rx="14" fill="#fef3d6" stroke="#e5a417" stroke-width="1.6"/>
  <text x="206" y="102" font-size="14" font-weight="700" fill="#6b4200">views/</text>
  <text x="206" y="118" font-size="10.5" fill="#4b4763">EJS templates = pages</text>
  <g font-size="11.5" fill="#1f1b2e">
    <text x="206" y="142" font-weight="700">home.ejs</text>
    <text x="206" y="162">about, call, error,</text>
    <text x="206" y="180">onboarding .ejs</text>
    <text x="206" y="202" font-weight="700">partials/ <tspan fill="#4b4763" font-size="10" font-weight="400">shared bits</tspan></text>
    <text x="218" y="220" font-size="10.5" fill="#4b4763">header, footer, eventTile...</text>
    <text x="206" y="242">auth/ <tspan fill="#4b4763" font-size="10">log in, sign up</tspan></text>
    <text x="206" y="262">events/</text>
    <text x="206" y="282">account/</text>
    <text x="206" y="302">social/ <tspan fill="#4b4763" font-size="10">seniors, chat</tspan></text>
    <text x="206" y="322">admin/ <tspan fill="#4b4763" font-size="10">staff pages</tspan></text>
    <text x="206" y="342">emails/</text>
  </g>

  <!-- public -->
  <rect x="370" y="78" width="160" height="210" rx="14" fill="#ddf5ee" stroke="#1f7a5f" stroke-width="1.6"/>
  <text x="384" y="102" font-size="14" font-weight="700" fill="#175e49">public/</text>
  <text x="384" y="118" font-size="10.5" fill="#4b4763">sent to the browser as-is</text>
  <g font-size="11.5" fill="#1f1b2e">
    <text x="384" y="142">css/main.css <tspan fill="#a8380a" font-size="10">built</tspan></text>
    <text x="384" y="162">js/ <tspan fill="#4b4763" font-size="10">small scripts</tspan></text>
    <text x="384" y="182">fonts/ <tspan fill="#4b4763" font-size="10">Outfit</tspan></text>
    <text x="384" y="202">images/</text>
    <text x="396" y="220" font-size="10.5" fill="#4b4763">events/ photos</text>
    <text x="396" y="238" font-size="10.5" fill="#4b4763">illustrations/ drawings</text>
    <text x="384" y="266" font-size="10.5" fill="#4b4763">/css/main.css in a page =</text>
    <text x="384" y="280" font-size="10.5" fill="#4b4763">public/css/main.css on disk</text>
  </g>

  <!-- the rest -->
  <rect x="548" y="78" width="160" height="300" rx="14" fill="#fde9dc" stroke="#a8380a" stroke-width="1.4"/>
  <text x="562" y="102" font-size="14" font-weight="700" fill="#a8380a">Everything else</text>
  <g font-size="11.5" fill="#1f1b2e">
    <text x="562" y="128" font-weight="700">locales/</text>
    <text x="574" y="146" font-size="10.5" fill="#4b4763">en.json, yo.json: all words</text>
    <text x="562" y="170">tests/ <tspan fill="#4b4763" font-size="10">npm test</tspan></text>
    <text x="562" y="192">docs/ <tspan fill="#4b4763" font-size="10">notes, this guide</tspan></text>
    <text x="562" y="218" font-weight="700">package.json</text>
    <text x="574" y="236" font-size="10.5" fill="#4b4763">commands + packages</text>
    <text x="562" y="260" font-weight="700">.env <tspan fill="#a8380a" font-size="10" font-weight="400">secret, not in Git</tspan></text>
    <text x="562" y="284">render.yaml</text>
    <text x="562" y="304">start-windows.bat</text>
    <text x="562" y="324">README, HANDOVER (.md)</text>
    <text x="562" y="344">node_modules/</text>
    <text x="574" y="360" font-size="10.5" fill="#4b4763">made by npm install</text>
  </g>

  <!-- how they talk -->
  <rect x="14" y="396" width="694" height="62" rx="12" fill="#efedfb"/>
  <text x="28" y="420" font-size="12" font-weight="700" fill="#231d5c">How they connect</text>
  <text x="28" y="442" font-size="11.5" fill="#1f1b2e">src/routes/ calls res.render('home') → views/home.ejs  ·  views use /css/main.css → public/css/main.css  ·  t('key') → locales/</text>
</svg>
