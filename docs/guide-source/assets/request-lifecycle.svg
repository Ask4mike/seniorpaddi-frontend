<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b3290"/></marker>
  </defs>
  <rect width="720" height="600" fill="#ffffff"/>
  <text x="360" y="24" font-size="15" font-weight="700" text-anchor="middle" fill="#231d5c">The life of one request: someone presses "Log in"</text>

  <g font-size="12.5">
    <g transform="translate(40,42)">
      <rect width="640" height="50" rx="12" fill="#ddf5ee" stroke="#1f7a5f"/>
      <circle cx="26" cy="25" r="14" fill="#1f7a5f"/><text x="26" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text>
      <text x="52" y="21" font-weight="700" fill="#1f1b2e">The browser sends the form: POST /login</text>
      <text x="52" y="38" font-size="11" fill="#4b4763">with phone, password and a hidden _csrf token (from views/auth/login.ejs)</text>
    </g>
    <g transform="translate(40,108)">
      <rect width="640" height="62" rx="12" fill="#f4f2fc" stroke="#4a3fb0"/>
      <circle cx="26" cy="31" r="14" fill="#4a3fb0"/><text x="26" y="36" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">2</text>
      <text x="52" y="21" font-weight="700" fill="#1f1b2e">Express runs the middleware in order</text>
      <text x="52" y="38" font-size="11" fill="#4b4763">src/app.js: read the form → session (config/session.js) → who and which language (middleware/locals.js)</text>
      <text x="52" y="53" font-size="11" fill="#4b4763">→ check the _csrf token (middleware/csrf.js) → password-change check (middleware/auth.js)</text>
    </g>
    <g transform="translate(40,186)">
      <rect width="640" height="50" rx="12" fill="#f4f2fc" stroke="#4a3fb0"/>
      <circle cx="26" cy="25" r="14" fill="#4a3fb0"/><text x="26" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text>
      <text x="52" y="21" font-weight="700" fill="#1f1b2e">The route that matches answers: router.post('/login', ...)</text>
      <text x="52" y="38" font-size="11" fill="#4b4763">src/routes/public.js, after loginLimiter (middleware/rateLimit.js) allows it</text>
    </g>
    <g transform="translate(40,252)">
      <rect width="640" height="50" rx="12" fill="#f4f2fc" stroke="#4a3fb0"/>
      <circle cx="26" cy="25" r="14" fill="#4a3fb0"/><text x="26" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">4</text>
      <text x="52" y="21" font-weight="700" fill="#1f1b2e">Tidy the phone number</text>
      <text x="52" y="38" font-size="11" fill="#4b4763">normalizePhone() in src/services/phone.js: 08031234567 → +2348031234567</text>
    </g>
    <g transform="translate(40,318)">
      <rect width="640" height="50" rx="12" fill="#e0dcf7" stroke="#4a3fb0"/>
      <circle cx="26" cy="25" r="14" fill="#4a3fb0"/><text x="26" y="30" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">5</text>
      <text x="52" y="21" font-weight="700" fill="#1f1b2e">Ask the database: User.findOne({ where: { phone } })</text>
      <text x="52" y="38" font-size="11" fill="#4b4763">src/models/user.js → PostgreSQL. Then bcrypt.compare() checks the password against the stored hash</text>
    </g>
  </g>
  <line x1="360" y1="368" x2="360" y2="384" stroke="#3b3290" stroke-width="2"/>
  <line x1="200" y1="384" x2="520" y2="384" stroke="#3b3290" stroke-width="2"/>
  <line x1="200" y1="384" x2="200" y2="404" stroke="#3b3290" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="384" x2="520" y2="404" stroke="#3b3290" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="12">
    <g transform="translate(40,408)">
      <rect width="320" height="150" rx="12" fill="#fde8dd" stroke="#a8380a"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#a8380a">6a. Wrong number or password</text>
      <text x="16" y="48" fill="#1f1b2e">res.status(400).render('auth/login',</text>
      <text x="16" y="64" fill="#1f1b2e">  { error: ..., phone: ... })</text>
      <text x="16" y="88" font-size="11" fill="#4b4763">EJS fills views/auth/login.ejs (plus the</text>
      <text x="16" y="103" font-size="11" fill="#4b4763">header and footer partials) with the error,</text>
      <text x="16" y="118" font-size="11" fill="#4b4763">and the finished HTML goes back to the</text>
      <text x="16" y="133" font-size="11" fill="#4b4763">browser. The phone box keeps what they typed.</text>
    </g>
    <g transform="translate(380,408)">
      <rect width="300" height="150" rx="12" fill="#ddf3ea" stroke="#1f7a5f"/>
      <text x="16" y="24" font-size="13" font-weight="700" fill="#1f7a5f">6b. Correct</text>
      <text x="16" y="48" fill="#1f1b2e">req.session.userId = user.id</text>
      <text x="16" y="64" fill="#1f1b2e">res.redirect('/')  (or /admin for staff)</text>
      <text x="16" y="88" font-size="11" fill="#4b4763">The session is saved in the database and the</text>
      <text x="16" y="103" font-size="11" fill="#4b4763">browser gets a cookie. "Redirect" tells the</text>
      <text x="16" y="118" font-size="11" fill="#4b4763">browser to ask for Home next, which starts</text>
      <text x="16" y="133" font-size="11" fill="#4b4763">a brand-new request at step 1.</text>
    </g>
  </g>
  <text x="360" y="586" font-size="11" text-anchor="middle" fill="#4b4763">Every page in SeniorPadi follows this same path. Only steps 3 to 6 change from page to page.</text>
</svg>
